version: '3.8'

services:
  whisper-transcriber:
    container_name: whisper-transcriber
    build: .
    ports:
      - "${APP_PORT:-8000}:8000"  # Se APP_PORT não estiver definido, usa 8000
    volumes:
      - .:/app                    # Monta diretório local dentro do contêiner (útil em dev)
    environment:
      - APP_PORT=${APP_PORT}
      - DEBUG=${DEBUG}
      - WHISPER_MODEL=${WHISPER_MODEL}
      - MAX_AUDIO_DURATION=${MAX_AUDIO_DURATION}
      - UPLOAD_FOLDER=${UPLOAD_FOLDER}
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN}
      - DEVICE_TYPE=${DEVICE_TYPE}
    restart: unless-stopped       # Reinicia o contêiner automaticamente se ele parar
